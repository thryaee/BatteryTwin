# ─────────────────────────────────────────────────────────────────
#  BatteryTwin – Render Deployment Configuration
#  https://render.com/docs/yaml-spec
#
#  Services defined here:
#    1. batterytwin-backend   – FastAPI web service (Python)
#    2. batterytwin-frontend  – React static site
#    3. batterytwin-db        – PostgreSQL 16 managed database
#
#  IMPORTANT: After deploying, set these environment variables
#  manually in the Render dashboard for batterytwin-backend:
#    - JWT_SECRET_KEY          (generate: python -c "import secrets; print(secrets.token_hex(32))")
#    - CORS_ORIGINS            (your Render frontend URL, e.g. https://batterytwin.onrender.com)
#
#  DATABASE_URL is injected automatically by Render from the db.
# ─────────────────────────────────────────────────────────────────

services:

  # ── 1. FastAPI Backend ─────────────────────────────────────────
  - type: web
    name: batterytwin-backend
    runtime: python
    region: oregon
    plan: free

    # Root of the repo is BatteryTwin/ so backend/ is the working dir
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    # Uvicorn bound to Render's injected $PORT
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # Health check – Render pings this to verify the service is up
    healthCheckPath: /health

    envVars:
      # ── App ────────────────────────────────────────────────────
      - key: APP_ENV
        value: production

      - key: LOG_LEVEL
        value: INFO

      # ── Database ───────────────────────────────────────────────
      # Render injects DATABASE_URL automatically from the linked DB.
      - key: DATABASE_URL
        fromDatabase:
          name: batterytwin-db
          property: connectionString

      # ── Auth ───────────────────────────────────────────────────
      # Set JWT_SECRET_KEY manually in the Render dashboard.
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: JWT_SECRET_KEY
        sync: false          # marks it as a secret – fill in dashboard

      - key: JWT_ALGORITHM
        value: HS256

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      - key: PASSWORD_MIN_LENGTH
        value: "8"

      - key: AUTH_RATE_LIMIT
        value: "10/minute"

      # ── CORS ───────────────────────────────────────────────────
      # Set this to your actual Render frontend URL after deployment.
      # Example: https://batterytwin-frontend.onrender.com
      - key: CORS_ORIGINS
        sync: false          # fill in dashboard after frontend is deployed

      # ── Simulator ──────────────────────────────────────────────
      # Use simulator in production (no physical ESP32 on Render)
      - key: USE_SIMULATOR
        value: "true"

      - key: SIMULATOR_INTERVAL_SECONDS
        value: "2"

      # ── ML ─────────────────────────────────────────────────────
      - key: ML_MODEL_DIR
        value: ml/saved_models

      # ── MQTT (not used in production simulator mode) ───────────
      - key: MQTT_BROKER_HOST
        value: localhost

      - key: MQTT_BROKER_PORT
        value: "1883"

      # ── Relay thresholds ───────────────────────────────────────
      - key: RELAY_MAX_TEMP_C
        value: "45.0"

      - key: RELAY_MIN_VOLTAGE_V
        value: "2.5"

      - key: RELAY_MAX_VOLTAGE_V
        value: "4.25"

      - key: RELAY_MAX_CURRENT_A
        value: "3.0"

  # ── 2. React Frontend (Static Site) ───────────────────────────
  - type: web
    name: batterytwin-frontend
    runtime: static
    region: oregon
    plan: free

    rootDir: dashboard/dashboard

    buildCommand: npm install --legacy-peer-deps && npm run build

    staticPublishPath: build

    # React Router needs all routes to serve index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Set this to your Render backend URL after backend is deployed.
      # Example: https://batterytwin-backend.onrender.com
      - key: REACT_APP_API_BASE_URL
        sync: false          # fill in dashboard after backend is deployed

      - key: REACT_APP_WS_URL
        sync: false          # e.g. wss://batterytwin-backend.onrender.com/ws

      - key: REACT_APP_POLL_INTERVAL_MS
        value: "5000"

      - key: ESLINT_NO_DEV_ERRORS
        value: "true"

# ── 3. PostgreSQL Database ─────────────────────────────────────
databases:
  - name: batterytwin-db
    databaseName: batterytwin
    user: batterytwin_user
    region: oregon
    plan: free
